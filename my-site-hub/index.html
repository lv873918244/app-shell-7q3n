        :root {

        * {

        }

        body {
            font-family: 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-text-size-adjust: 100%;
        }

        /* --- 标题部分 --- */
        header {
            text-align: center;
            margin-bottom: 8px;
            width: 100%;
        }

        h1 {
            font-family: 'Noto Sans SC', sans-serif;
            font-weight: 700;
            font-size: clamp(1rem, 4.5vw, 1.4rem);
            margin: 0 auto;
            position: relative;
            display: inline-block;
            padding: 0 4px;
            color: var(--text-color);
            z-index: 1;
            white-space: nowrap;
            letter-spacing: 0.01em;
        }

        h1::before {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 0;
            width: 100%;
            height: 6px;
            background: rgba(255, 204, 51, 0.35);
            border-radius: 10px;
            z-index: -1;
        }

        /* --- 始终显示的超紧凑说明区域 --- */
        .info-container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 8px 10px;
            margin-bottom: 10px;
            border: 1.5px solid rgba(255, 204, 51, 0.35);
            box-shadow: 0 2px 6px rgba(92, 75, 58, 0.04);
            text-align: center;
        }

        .rule-text {
            font-size: 0.72rem;
            line-height: 1.35;
        }

        .warning {
            color: #e67e22;
            font-weight: bold;
        }

        .notice-text {
            margin-top: 4px;
            font-size: 0.68rem;
            color: var(--sub-text-color);
            line-height: 1.25;
        }

        /* --- 3列固定卡片容器 --- */
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 800px;
            width: 100%;
        }

        /* --- 卡片设计 --- */
        .card {
            background: linear-gradient(145deg, #ffffff, #fffdf8);
            border-radius: 14px;
            padding: 10px 4px 8px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 3px 8px rgba(92, 75, 58, 0.05), 0 1px 2px rgba(0, 0, 0, 0.02);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, border-color 0.2s ease;
            border: 1.5px solid rgba(255, 204, 51, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 4px;
            position: relative;
            min-height: 64px;
        }

        .card:not(.coming-soon):hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 6px 14px var(--accent-glow);
            border-color: var(--primary-color);
        }

        .card.coming-soon {
            opacity: 0.7;
            cursor: default;
            border: 1.5px dashed #dcd6a9;
            background: rgba(255, 255, 255, 0.5);
        }

        .icon {
            font-size: 1.25rem;
            line-height: 1;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.08));
        }

        .title {
            font-weight: 700;
            font-size: 0.73rem;
            line-height: 1.2;
            word-break: break-word;
            color: var(--text-color);
        }

        @media (max-width: 480px) {
            body { padding: 8px 4px; }
            .container { gap: 6px; }
            .card { padding: 8px 3px 6px; min-height: 58px; border-radius: 12px; }
            .icon { font-size: 1.1rem; }
            .title { font-size: 0.65rem; letter-spacing: -0.02em; }
        }
    </style>
</head>
